<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Thiết Bị</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0e27;
    color: #e6ebf5;
    padding: 12px;
    min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; }
.header {
    background: #0d1220;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid rgba(148,163,184,0.12);
}
.header h1 { font-size: 24px; margin-bottom: 8px; }
.time { font-size: 12px; color: #7c8aa3; }

.main-flex { display: flex; gap: 20px; }
@media(max-width:1200px) { .main-flex { flex-direction: column; } }

.form-section { width: 350px; flex-shrink: 0; }
@media(max-width:1200px) { .form-section { width: 100%; } }

.content { flex: 1; }

.card {
    background: #0d1220;
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
}

.btn {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    margin-bottom: 8px;
}
.btn:hover { filter: brightness(1.2); }
.btn-outline {
    background: transparent;
    border: 1px solid rgba(148,163,184,0.2);
    color: #e6ebf5;
}
.btn-outline:hover { border-color: #3b82f6; color: #3b82f6; }

.btn-small {
    padding: 8px 12px;
    font-size: 12px;
    width: auto;
}

.field {
    margin-bottom: 14px;
}
.field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #7c8aa3;
    margin-bottom: 6px;
    text-transform: uppercase;
}
.field input,
.field select {
    width: 100%;
    padding: 10px;
    background: #111a2e;
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 8px;
    color: #e6ebf5;
    font-size: 13px;
}
.field input:focus,
.field select:focus {
    outline: none;
    border-color: #3b82f6;
}

.location-list {
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 8px;
    max-height: 150px;
    overflow-y: auto;
}
.location-item {
    padding: 8px;
    border-bottom: 1px solid rgba(148,163,184,0.12);
    cursor: pointer;
    font-size: 12px;
}
.location-item:hover { background: #0f1526; padding-left: 12px; }

.search-bar { margin-bottom: 20px; }
.search-bar input {
    width: 100%;
    padding: 12px;
    background: #111a2e;
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 10px;
    color: #e6ebf5;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
thead { background: #0f1526; }
th {
    text-align: left;
    padding: 12px;
    font-weight: 600;
    color: #7c8aa3;
    border-bottom: 1px solid rgba(148,163,184,0.12);
}
td {
    padding: 12px;
    border-bottom: 1px solid rgba(148,163,184,0.12);
}
tbody tr:hover { background: #111a2e; }

.status {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
.status-warehouse { background: rgba(34,197,94,0.14); color: #22c55e; }
.status-factory { background: rgba(245,158,11,0.14); color: #f59e0b; }
.status-line { background: rgba(239,68,68,0.14); color: #ef4444; }

.btn-action {
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.2);
    color: #3b82f6;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}
.btn-action:hover { background: #3b82f6; color: #fff; }

.stat {
    background: #111a2e;
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
}
.stat-label { color: #7c8aa3; font-size: 12px; }
.stat-value { font-weight: 700; font-size: 14px; }

.empty { text-align: center; padding: 40px; color: #7c8aa3; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.modal-content {
    background: #0d1220;
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 12px;
    padding: 20px;
    max-width: 400px;
    width: 90%;
}
.modal-head { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: #e6ebf5; font-size: 24px; cursor: pointer; }

.form-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #3b82f6; }
.form-actions { display: flex; gap: 8px; }
.form-actions button { flex: 1; padding: 10px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 Quản Lý Thiết Bị</h1>
        <div class="time" id="timeDisplay"></div>
    </div>

    <div class="main-flex">
        <!-- FORM THÊM - BÊN TRÁI -->
        <div class="form-section">
            <div class="card">
                <div class="form-title">➕ Thêm Thiết Bị</div>
                
                <div class="field">
                    <label>Mẫu Thiết Bị</label>
                    <input type="text" id="inputModel" placeholder="VD: Laptop Dell...">
                </div>

                <div class="field">
                    <label>Vị Trí Kho *</label>
                    <input type="text" id="locationSearch" placeholder="🔍 Tìm (A01-A)..." onkeyup="searchLocation()">
                    <div class="location-list" id="locationList" style="margin-top:6px;"></div>
                </div>

                <div class="form-actions">
                    <button class="btn" onclick="saveDevice()">Lưu</button>
                    <button class="btn btn-outline" onclick="resetForm()">Xóa</button>
                    <button class="btn btn-outline" style="background:rgba(168,85,247,0.12);border-color:rgba(168,85,247,0.2);color:#a855f7;" onclick="loadSampleData()">📊 Mẫu</button>
                </div>
            </div>

            <div class="card">
                <div style="font-size:12px;font-weight:700;color:#7c8aa3;margin-bottom:12px;text-transform:uppercase;">Thống Kê</div>
                <div class="stat">
                    <span class="stat-label">📦 Tổng</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🏢 Ở Kho</span>
                    <span class="stat-value" id="statWarehouse">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🏭 Ở Xưởng</span>
                    <span class="stat-value" id="statFactory">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">⚙️ Dưới Line</span>
                    <span class="stat-value" id="statLine">0</span>
                </div>
            </div>
        </div>

        <!-- BẢNG QUẢN LÝ - BÊN PHẢI -->
        <div class="content">
            <div class="card">
                <div class="search-bar">
                    <input type="text" id="search" placeholder="🔍 Tìm model, vị trí kho, mã..." onkeyup="applyFilters()">
                </div>
                
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Mẫu</th>
                                <th>Vị Trí Kho</th>
                                <th>Trạng Thái</th>
                                <th>Mã</th>
                                <th>Ngày</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>

                <div class="empty" id="emptyState" style="display:none;">📭 Không có thiết bị</div>
            </div>
        </div>
    </div>
</div>

<!-- DATES MODAL -->
<div class="modal" id="datesModal">
    <div class="modal-content">
        <div class="modal-head">
            <span>Cập Nhật Ngày</span>
            <button class="modal-close" onclick="closeDatesModal()">×</button>
        </div>
        
        <div class="field">
            <label>Ngày Phát</label>
            <input type="date" id="inputDateSent">
        </div>

        <div class="field">
            <label>Ngày Về</label>
            <input type="date" id="inputDateReturn">
        </div>

        <div style="display:flex;gap:8px;">
            <button class="btn" onclick="saveDates()" style="flex:1;">Lưu</button>
            <button class="btn btn-outline" onclick="closeDatesModal()" style="flex:1;">Hủy</button>
        </div>
    </div>
</div>

<script>
let devices = [];
let currentEditDates = null;

function getWarehouseLocations() {
    const codes = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'M'];
    const prefixes = ['A', 'AB', 'AC', 'AD', 'AE', 'AF', 'AG', 'AM', 'AN', 'AH', 'AO'];
    let locs = [];
    prefixes.forEach(p => {
        const max = p === 'A' ? 50 : 60;
        for (let i = 1; i <= max; i++) {
            const num = String(i).padStart(2, '0');
            codes.forEach(code => {
                locs.push(`${p}${num}-${code}`);
            });
        }
    });
    return locs;
}

function getFactoryCodes() {
    let codes = [];
    for (let i = 11; i <= 16; i++) codes.push(`Z${i}`);
    for (let i = 1; i <= 18; i++) codes.push(`${i}`);
    return codes;
}

function getLineCodes() {
    let codes = [];
    for (let i = 1; i <= 30; i++) codes.push(`L${i}`);
    return codes;
}

function updateTime() {
    const now = new Date();
    const time = now.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const date = now.toLocaleDateString('vi-VN');
    document.getElementById('timeDisplay').textContent = `${time} | ${date}`;
}
setInterval(updateTime, 1000);
updateTime();

function loadData() {
    const data = localStorage.getItem('devices_final');
    if (data) {
        try { devices = JSON.parse(data); } catch(e) { devices = []; }
    }
}

function saveData() {
    localStorage.setItem('devices_final', JSON.stringify(devices));
}

function searchLocation() {
    const q = document.getElementById('locationSearch').value.toLowerCase();
    const locs = getWarehouseLocations();
    const filtered = locs.filter(l => l.toLowerCase().includes(q));
    renderLocationList(filtered);
}

function renderLocationList(locs) {
    const html = locs.map(loc => 
        `<div class="location-item" onclick="selectLocation('${loc}')">${loc}</div>`
    ).join('');
    document.getElementById('locationList').innerHTML = html || '<div style="padding:10px;text-align:center;color:#7c8aa3;font-size:11px;">Không tìm thấy</div>';
}

function selectLocation(loc) {
    document.getElementById('locationSearch').value = loc;
    document.getElementById('inputLocation').value = loc;
    renderLocationList(getWarehouseLocations());
}

function saveDevice() {
    const model = document.getElementById('inputModel').value.trim() || 'N/A';
    const location = document.getElementById('locationSearch').value || document.getElementById('inputLocation').value;
    
    if (!location) { alert('Chọn Vị Trí Kho!'); return; }
    
    devices.push({
        id: Date.now(),
        model,
        location,
        status: 'warehouse',
        code: '',
        dateSent: '',
        dateReturn: ''
    });
    
    saveData();
    resetForm();
    render();
    updateStats();
}

function resetForm() {
    document.getElementById('inputModel').value = '';
    document.getElementById('locationSearch').value = '';
    document.getElementById('inputLocation').value = '';
    renderLocationList(getWarehouseLocations());
}

function loadSampleData() {
    if (confirm('Thêm tất cả 5,850 vị trí kho vào hệ thống? (Bạn sẽ sửa tên sau)')) {
        const warehouseLocations = getWarehouseLocations();
        
        devices = warehouseLocations.map((loc, i) => ({
            id: Date.now() + i,
            model: 'N/A',
            location: loc,
            status: 'warehouse',
            code: '',
            dateSent: '',
            dateReturn: ''
        }));

        saveData();
        resetForm();
        render();
        updateStats();
        alert(`✓ Đã thêm ${warehouseLocations.length} vị trí kho!\n\nBây giờ bạn chỉ cần click "Ngày" để sửa tên và thay đổi trạng thái.`);
    }
}

function editDevice(id) {
    const d = devices.find(x => x.id === id);
    if (!d) return;
    document.getElementById('inputModel').value = d.model;
    document.getElementById('locationSearch').value = d.location;
    document.getElementById('inputLocation').value = d.location;
    
    // Change button to update
    const saveBtn = document.querySelector('.form-section .btn');
    const oldText = saveBtn.textContent;
    saveBtn.textContent = 'Cập Nhật';
    saveBtn.onclick = () => updateDevice(id);
    
    // Add reset button
    const resetBtn = document.querySelectorAll('.form-section .btn')[1];
    resetBtn.onclick = () => {
        resetForm();
        saveBtn.textContent = oldText;
        saveBtn.onclick = saveDevice;
    };
    
    // Scroll to form
    document.querySelector('.form-section').scrollIntoView({behavior: 'smooth'});
}

function updateDevice(id) {
    const d = devices.find(x => x.id === id);
    if (!d) return;
    
    const model = document.getElementById('inputModel').value.trim() || 'N/A';
    const location = document.getElementById('locationSearch').value || document.getElementById('inputLocation').value;
    
    if (!location) { alert('Chọn Vị Trí Kho!'); return; }
    
    d.model = model;
    d.location = location;
    
    saveData();
    resetForm();
    render();
    
    // Reset button
    const saveBtn = document.querySelector('.form-section .btn');
    const resetBtn = document.querySelectorAll('.form-section .btn')[1];
    saveBtn.textContent = 'Lưu';
    saveBtn.onclick = saveDevice;
    resetBtn.onclick = resetForm;
    
    alert('✓ Cập nhật thành công!');
}

function deleteDevice(id) {
    if (!confirm('Xóa?')) return;
    devices = devices.filter(d => d.id !== id);
    saveData();
    render();
    updateStats();
}

function openDatesModal(id) {
    currentEditDates = id;
    const d = devices.find(x => x.id === id);
    if (!d) return;
    document.getElementById('inputDateSent').value = d.dateSent || '';
    document.getElementById('inputDateReturn').value = d.dateReturn || '';
    document.getElementById('datesModal').classList.add('show');
}

function closeDatesModal() {
    document.getElementById('datesModal').classList.remove('show');
}

function saveDates() {
    if (!currentEditDates) return;
    const d = devices.find(x => x.id === currentEditDates);
    if (!d) return;
    d.dateSent = document.getElementById('inputDateSent').value;
    d.dateReturn = document.getElementById('inputDateReturn').value;
    saveData();
    closeDatesModal();
    render();
}

function changeStatus(id) {
    const d = devices.find(x => x.id === id);
    if (!d) return;
    const statuses = ['warehouse', 'factory', 'line'];
    const i = statuses.indexOf(d.status);
    d.status = statuses[(i + 1) % 3];
    d.code = '';
    saveData();
    render();
    updateStats();
}

function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = devices.filter(d => 
        d.model.toLowerCase().includes(q) || 
        d.location.toLowerCase().includes(q) ||
        (d.code && d.code.toLowerCase().includes(q))
    );
    renderTable(filtered);
}

function render() {
    renderTable(devices);
}

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    
    if (data.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    
    empty.style.display = 'none';
    tbody.innerHTML = data.map((d, i) => {
        const status = {warehouse: '🏢 Ở Kho', factory: '🏭 Ở Xưởng', line: '⚙️ Dưới Line'}[d.status];
        const cls = {warehouse: 'status-warehouse', factory: 'status-factory', line: 'status-line'}[d.status];
        return `<tr>
            <td>${i + 1}</td>
            <td>${d.model}</td>
            <td>${d.location}</td>
            <td><span class="status ${cls}" onclick="changeStatus(${d.id})">${status}</span></td>
            <td><strong>${d.code || '-'}</strong></td>
            <td>${d.dateSent ? d.dateSent.split('-').reverse().join('/') : '-'}</td>
            <td>
                <button class="btn-action btn-small" onclick="editDevice(${d.id})">Sửa</button>
                <button class="btn-action btn-small" onclick="openDatesModal(${d.id})">Ngày</button>
                <button class="btn-action btn-small" style="background:rgba(239,68,68,0.12);color:#ef4444;border-color:rgba(239,68,68,0.2);" onclick="deleteDevice(${d.id})">Xóa</button>
            </td>
        </tr>`;
    }).join('');
}

function updateStats() {
    document.getElementById('statTotal').textContent = devices.length;
    document.getElementById('statWarehouse').textContent = devices.filter(d => d.status === 'warehouse').length;
    document.getElementById('statFactory').textContent = devices.filter(d => d.status === 'factory').length;
    document.getElementById('statLine').textContent = devices.filter(d => d.status === 'line').length;
}

window.addEventListener('load', () => {
    loadData();
    renderLocationList(getWarehouseLocations());
    render();
    updateStats();
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
    }
});

document.addEventListener('DOMContentLoaded', () => {
    const inp = document.createElement('input');
    inp.type = 'hidden';
    inp.id = 'inputLocation';
    document.body.appendChild(inp);
});
</script>

</body>
</html>
